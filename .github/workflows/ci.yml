name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Rotadesk.slnx
      - name: check formatting
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format Rotadesk.slnx --verify-no-changes --no-restore
      - run: dotnet build Rotadesk.slnx --configuration Release --no-restore
      - name: test everything, with PostgreSQL in Docker
        if: matrix.os == 'ubuntu-latest'
        run: dotnet test --solution Rotadesk.slnx --configuration Release --no-build
      # GitHub's macOS and Windows runners can't run Linux containers, so they run the domain tests only.
      - name: test the domain
        if: matrix.os != 'ubuntu-latest'
        run: dotnet test --project tests/Rotadesk.Domain.Tests --configuration Release --no-build

  web:
    name: web app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # Type-checks, then builds into the API's wwwroot, the way the Dockerfile will.
      - run: npm run build

  image:
    name: docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build --tag rotadesk:ci .
