name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore Rotadesk.slnx
      - name: check formatting
        if: matrix.os == 'ubuntu-latest'
        run: dotnet format Rotadesk.slnx --verify-no-changes --no-restore
      - run: dotnet build Rotadesk.slnx --configuration Release --no-restore
      - run: dotnet test --solution Rotadesk.slnx --configuration Release --no-build
